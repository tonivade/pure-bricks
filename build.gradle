plugins {
  id 'java'
  id 'application'
  id 'jacoco'
  id 'com.gradleup.shadow' version '9.6.1'
  id 'org.openjfx.javafxplugin' version '0.1.0'
  id 'org.beryx.runtime' version '2.0.1'
}

group = 'com.github.tonivade'
version = '0.1-SNAPSHOT'

repositories {
  mavenLocal()
  mavenCentral()
  maven {
    url = 'https://central.sonatype.com/repository/maven-snapshots/'
  }
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
  withJavadocJar()
  withSourcesJar()
}

jacoco {
  toolVersion = '0.8.16'
}

javafx {
    version = "25.0.5.1"
    modules = [ 
      'javafx.base', 
      'javafx.controls', 
      'javafx.graphics', 
      'javafx.media' 
    ]
}

compileJava {
  options.compilerArgs << '-Xlint:unchecked'
  options.compilerArgs << '-Xlint:rawtypes'
  options.release = 25
}

compileTestJava {
  options.compilerArgs << '-Xlint:unchecked'
  options.compilerArgs << '-Xlint:rawtypes'
  options.release = 25
}

test {
  useJUnitPlatform()

  reports.html.required = true
}

jacocoTestReport {
  reports {
    xml.required = true
    html.required = true
    xml.outputLocation = layout.buildDirectory.file("reports/jacoco/report.xml")
  }
}

dependencies {
  implementation "com.github.tonivade:purefun-monad:$purefunVersion"
  implementation "com.github.tonivade:purefun-transformer:$purefunVersion"
  runtimeOnly "com.github.tonivade:purefun-instances:$purefunVersion"
  testImplementation platform("org.junit:junit-bom:$junitVersion")
  testImplementation "org.junit.jupiter:junit-jupiter-engine"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

application {
  mainClass = 'com.github.tonivade.bricks.Launcher'
}

shadowJar {
  manifest {
    attributes "Main-Class": "com.github.tonivade.bricks.Launcher"
  }
}

runtime {
  options = [
    '--strip-debug',
    '--compress', '2',
    '--no-header-files',
    '--no-man-pages'
  ]

  modules = [
    'java.base',
    'java.desktop'
  ]
}
